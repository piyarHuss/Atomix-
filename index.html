const CURS='₹';
const DR=[{g:30},{g:50},{c:.10},{g:60},{c:.15},{g:70},{g:100,c:.25}];

/* Reward ud kar balance me jata hai. Animation ruk bhi jaye to failsafe se balance add + popup band hota hai */
function rewardFx(card,r,done){
 const app=document.getElementById('app'),once=f=>{let d=0;return()=>{if(d)return;d=1;f()}};
 const kinds=[];if(r.g)kinds.push('g');if(r.c)kinds.push('c');
 const applied={g:0,c:0};let left=kinds.length,over=0;
 const settle=k=>{if(applied[k])return;applied[k]=1;
  if(k==='g')BAL.gems+=r.g;else BAL.cash=+(BAL.cash+r.c).toFixed(2);saveBal();
  const tg=document.getElementById(k==='g'?'bg':'bc');if(tg)tg.textContent=k==='g'?String(Math.round(BAL.gems)):CURS+BAL.cash.toFixed(2);
  sfx('balance_add')};
 const end=once(()=>{over=1;kinds.forEach(settle);setTimeout(done,500)});
 setTimeout(end,3800);   /* failsafe */
 try{

/* ================= MODULAR GAME LOADER =================
   Har game ka engine alag JS file me hoga.
   Module API: window.LudoGame.start({mount, match, onFinish, onExit})
*/
const GAME_SCRIPT_CACHE={};
let activeGameModule=null;

function loadGameModule(gameKey){
 const cfg=GAMES[gameKey];
 if(!cfg || !cfg.script || !cfg.module) {
   return Promise.reject(new Error('Game module config missing: '+gameKey));
 }
 if(window[cfg.module]) return Promise.resolve(window[cfg.module]);
 if(GAME_SCRIPT_CACHE[cfg.script]) return GAME_SCRIPT_CACHE[cfg.script];

 GAME_SCRIPT_CACHE[cfg.script]=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src=cfg.script;
   script.async=true;
   script.onload=()=>{
     const mod=window[cfg.module];
     if(mod && typeof mod.start==='function') resolve(mod);
     else reject(new Error(cfg.module+' must expose start(options)'));
   };
   script.onerror=()=>reject(new Error('Could not load '+cfg.script));
   document.head.appendChild(script);
 });
 return GAME_SCRIPT_CACHE[cfg.script];
}

/* ================= GAME RESULT =================
 ludo.js se onFinish({won:true}) ya onFinish({won:false}) bhejo.
 Jeetne par pool.win (₹) upar se udkar balance me jata hai. Haarne par kuch nahi milta.

 FIX: pehle "winner" ka naam bot/ai/opponent/computer na ho to jeet maan li jati thi,
 isliye haarne par bhi paise mil jate the. Ab sirf tab jeet maani jayegi jab pakka ho
 ki insaan player jeeta. Anjaan result = HAAR (galti se paise nahi milenge). */
let RES={won:false,pool:null,amt:0,paid:0,busy:0};
function resFb(i){const t=i.nextElementSibling,p=i.parentNode;p.innerHTML=t.innerHTML}
/* >>> DEBUG_RESULT=true: result screen ke neeche ludo.js ka asli result text dikhta hai (screenshot bhejne ke liye).
   Sab theek hone par false kar dena.
   >>> INVERT_RESULT: agar ludo.js har baar ulta result bhej raha ho (jeetne par lost, haarne par win)
   to ise true kar do. Ye sirf temporary jugaad hai, asli fix ludo.js me hona chahiye. <<< */
const DEBUG_RESULT=false, INVERT_RESULT=false;
let RAW_RESULT='';
function iWon(r){
 try{RAW_RESULT=JSON.stringify(r)}catch(e){RAW_RESULT=String(r)}
 console.log('GAME RESULT:',RAW_RESULT);
 const v=iWon0(r);
 return INVERT_RESULT?!v:v;
}
function iWon0(r){
 if(!r)return false;
 /* 1) Seedha true/false wali keys sabse pehle */
 if(typeof r.won==='boolean')return r.won;
 if(typeof r.win==='boolean')return r.win;
 if(typeof r.isWinner==='boolean')return r.isWinner;
 if(typeof r.humanWon==='boolean')return r.humanWon;
 if(typeof r.playerWon==='boolean')return r.playerWon;
 if(typeof r.youWon==='boolean')return r.youWon;
 /* 2) Winner ka naam: sirf ye naam tumhari jeet maane jayenge */
 const w=String(r.winner??r.winnerName??r.winnerId??'').toLowerCase().trim();
 /* ludo.js me insaan = 'blue', bot/opponent = 'red' */
 return ['blue','you','player','me','human','user','player1','p1'].includes(w);
}
function resultFx(){

 const box=document.getElementById('rspz');

}

async function onMatchStart(m){
 const cfg=GAMES[m.game];
 const screen=document.getElementById('screen');
 const app=document.getElementById('app');
 clearTimeout(mtT);
 app.classList.remove('mt');
 app.classList.add('game-active');
 document.getElementById('nav').style.display='none';
 screen.style.background='transparent';
 screen.innerHTML='<div id="game-root" class="game-root"><div class="game-loading">Loading '+(cfg?.name||m.game)+'...</div></div>';
 const mount=document.getElementById('game-root');

 try{
   const mod=await loadGameModule(m.game);
   if(cur!=='match' || !mount.isConnected) return;
   activeGameModule=mod;
   let finished=false;   /* FIX: result sirf ek baar count hoga (double reward nahi milega) */
   mod.start({
     mount,
     match:m,
     onFinish:(result)=>{
       if(finished)return;
       finished=true;
       if(activeGameModule && typeof activeGameModule.stop==='function'){
         try{activeGameModule.stop()}catch(e){console.warn('Game cleanup error',e)}
       }
       activeGameModule=null;
       app.classList.remove('game-active');
       const p=MATCH.pool;
       const won=iWon(result);
       tkAdd('p1');
       msAdd('g5');
       RES={won:won,pool:p,amt:(won&&p)?p.win:0,paid:0,busy:0,opName:m.opponent,opAv:m.opAvKey};   /* haarne par amt = 0 */
       go('result');
     },
     onExit:()=>{
       if(activeGameModule && typeof activeGameModule.stop==='function'){
         try{activeGameModule.stop()}catch(e){console.warn('Game cleanup error',e)}
       }
       activeGameModule=null;
       app.classList.remove('game-active');
       go('home');
     }
   });
 }catch(err){
   console.error('Game module error:',err);
   mount.innerHTML='<div class="game-error"><b>Game could not be loaded</b><small>'+String(err.message||err)+'</small><button onclick="go(\'home\')">Back to Home</button></div>';
 }
}

/* ================= FIREBASE SYNC (realtime) =================
 Firebase se data aata hai -> local variables update. Apni hi write ka echo ignore hota hai (same value), isliye animation disturb nahi hoti.
 Doosre device/tab se change aaye to screen live update hoti hai. */
function applyRemote(v,first){
 v=v||{};
 /* balance */
 const nb=Object.assign({cash:10,gems:70},v.bal||{});
 if(nb.cash!==BAL.cash||nb.gems!==BAL.gems){BAL.cash=nb.cash;BAL.gems=nb.gems;refreshBal()}
 /* avatar */
 const na=v.myAv||1;
 if(na!==myAv){myAv=na;if(!first&&(cur==='home'||cur==='profile'||cur==='pool'||cur==='menu'))go(cur)}
 /* sound */
 const ns=Object.assign({sfx:1,mus:1},v.snd||{});
 if(ns.sfx!==S.sfx||ns.mus!==S.mus){S.sfx=ns.sfx;S.mus=ns.mus;if(!first)musicOn()}
 /* daily reward */
 DRraw=v.dr||{day:0,last:''};
 /* missions */
 const nm={p:(v.ms&&v.ms.p)||Object.assign({},MSDEF),c:(v.ms&&v.ms.c)||{}};
 if(jx(nm)!==jx(MS)){MS=nm;if(!first&&cur==='missions')go('missions')}
 /* tasks */
 TKraw=v.tk||null;const nt=TK0();
 if(jx(nt)!==jx(TK)){TK=nt;if(!first&&cur==='tasks')go('tasks')}
}
async function initCloud(){
 try{
  const cred=await firebase.auth().signInAnonymously();   /* Console me Authentication > Anonymous enable hona chahiye */
  UID=cred.user.uid;uref=fdb.ref('users/'+UID);
  const snap=await uref.once('value');
  const first=snap.val();
  applyRemote(first,true);
  if(!first){   /* naya user: default data cloud me bana do */
   uref.set({bal:BAL,myAv:myAv,snd:S,dr:DRraw,ms:MS,tk:TK,createdAt:firebase.database.ServerValue.TIMESTAMP}).catch(console.error);
  }
  uref.on('value',s=>applyRemote(s.val(),false));   /* realtime listener */
 }catch(e){
  console.error('Firebase init fail',e);
  toast('Offline mode: data save nahi hoga');
 }
}
async function boot(){
 document.getElementById('screen').innerHTML='<div class="ld">Loading...</div>';
 await initCloud();
 go('home');setTimeout(showDaily,500);
}
