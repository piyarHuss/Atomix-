<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earn TON</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--tx:#0a1f3d;--sub:#3b5678;--blob1:#7cc8ff;--blob2:#b9a6ff;--coin:#ffffffb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050a17;--tx:#eaf4ff;--sub:#8fa8c8;--blob1:#0a5fa8;--blob2:#4b2fa0;--coin:#ffffff14}}
:root[data-theme="dark"]{--bg:#050a17;--tx:#eaf4ff;--sub:#8fa8c8;--blob1:#0a5fa8;--blob2:#4b2fa0;--coin:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;overflow:hidden}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75}
.b1{background:radial-gradient(circle,var(--blob1),transparent 65%);top:-25vmax;left:-20vmax;animation:drift1 14s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,var(--blob2),transparent 65%);bottom:-28vmax;right:-22vmax;animation:drift2 17s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.2)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--coin) 1px,transparent 1px),linear-gradient(90deg,var(--coin) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(circle at center,#000 20%,transparent 70%)}
.coin{position:absolute;bottom:-60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#37c3ff,#0072c6);color:#fff;font-weight:800;box-shadow:0 0 18px #0098ea88,inset 0 0 8px #fff6;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) rotateY(0);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translateY(-115vh) rotateY(720deg);opacity:0}}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center}
.stage{position:relative;display:grid;place-items:center}
.ring{position:absolute;width:100%;height:100%;border-radius:999px;border:2px solid #0098ea;opacity:0;animation:pulse 3.2s ease-out infinite}
.ring:nth-child(2){animation-delay:1.05s}.ring:nth-child(3){animation-delay:2.1s}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9,2.6);opacity:0}}
.cta{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:16px;text-decoration:none;color:#fff;font-weight:800;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:-.02em;padding:.55em 1em .55em .8em;border-radius:999px;background:linear-gradient(135deg,#20b4ff,#0072c6 70%);box-shadow:0 18px 50px #0098ea77,0 0 0 4px #ffffff33 inset;animation:float 4s ease-in-out infinite;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes float{50%{transform:translateY(-10px)}}
.cta:hover{box-shadow:0 22px 64px #0098eaaa,0 0 0 4px #ffffff55 inset}
.cta:active{animation:none;transform:scale(.94)}
.cta:focus-visible{outline:4px solid #fff;outline-offset:4px}
.cta svg{width:1.15em;height:1.15em;flex:none;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.hint{margin:0;color:var(--sub);font-size:1rem;font-weight:500;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.coin{display:none}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="grid"></div><div id="coins"></div></div>
<main>
  <div class="stage">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <a class="cta" href="https://t.me/MegaTonPlay_bot" target="_blank" rel="noopener noreferrer" aria-label="Earn TON, Telegram bot kholo">
      <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M28 3 5 15v6l23 32 23-32v-6z" fill="#fff"/><path d="M28 12v32M28 12 14 20l14 24 14-24z" fill="none" stroke="#0072c6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Earn TON
    </a>
  </div>
  <p class="hint">Tap karke Telegram bot kholo</p>
</main>
<script>
(function(){
  var box=document.getElementById('coins');
  for(var i=0;i<16;i++){
    var c=document.createElement('span'),s=24+Math.random()*34;
    c.className='coin';c.textContent='◆';
    c.style.cssText='left:'+(Math.random()*96)+'%;width:'+s+'px;height:'+s+'px;font-size:'+(s*.45)+'px;animation-duration:'+(9+Math.random()*9)+'s;animation-delay:'+(-Math.random()*14)+'s';
    box.appendChild(c);
  }
})();
</script>
</body>
</html>
